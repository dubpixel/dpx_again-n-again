title: dpx_again-n-again
description: Drag any macOS app onto it to build a launcher that opens a new instance every time (open -n). Run multiple copies of an app.
remote_theme: pages-themes/midnight@v0.2.0
plugins:
- jekyll-remote-theme # add this line to the plugins list if you already have one
theme: jekyll-theme-minimal
markdown: kramdown
kramdown:
  parse_block_html: true
  typographic_syms:
    ndash: '--'
    mdash: '---'
    laquo_space: '<< '
    raquo_space: ' >>'
    laquo: '<<'
    raquo: '>>'
    hellip: '...'

